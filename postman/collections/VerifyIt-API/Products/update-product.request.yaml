$kind: http-request
name: Update Product
method: PATCH
url: "{{baseUrl}}/api/products/"
order: 4000
body:
  type: formdata
  content:
    - type: text
      key: name
      value: changed
      disabled: false
    - type: text
      key: description
      value: ""
      disabled: false
    - type: text
      key: category
      value: ""
      disabled: false
    - type: text
      key: batch
      value: ""
      disabled: false
    - type: text
      key: expiryDate
      value: ""
      disabled: false
    - type: text
      key: nafdacNumber
      value: ""
      disabled: false
    - type: text
      key: ndleaNumber
      value: ""
      disabled: false
    - type: file
      key: images
      src:
        - ""
      disabled: true
